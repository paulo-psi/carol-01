      <text x="80.0" y="21" class="bubble-text" fill="#92400E" text-anchor="middle">"Espaço em 360°!"</text>
    </g>
  
    <!-- Balão de Fala da Carol -->
    <g transform="translate(1079.2, 615)" filter="url(#bubble-shadow)">
      <path d="M 16 0 L 169 0 A 16 16 0 0 1 185 16 A 16 16 0 0 1 169 32 L 98.5 32 L 92.5 38 L 86.5 32 L 16 32 A 16 16 0 0 1 0 16 A 16 16 0 0 1 16 0 Z" fill="#F0FDFA" stroke="#319795" stroke-width="1.3" />
      <text x="92.5" y="21" class="bubble-text" fill="#0F766E" text-anchor="middle">"A fáscia deslizando!"</text>
