      <text x="107.5" y="21" class="bubble-text" fill="#0F766E" text-anchor="middle">"Onde dói ≠ Onde começou"</text>
    </g>
  
    <!-- Balão de Fala da Carol -->
    <g transform="translate(1510.0, 175)" filter="url(#bubble-shadow)">
